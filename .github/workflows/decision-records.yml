name: Validate decision records

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate records and published history
        run: node scripts/decisions/cli.mjs validate --base "$DECISIONS_BASE_SHA"
        env:
          DECISIONS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DECISIONS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
